version: "2"
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
    - golines
linters:
  enable:
    - staticcheck
    - govet
    - errcheck
    - gosec
    - revive
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - forbidigo
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        # These panic on *DictType; use the DictSafe* wrappers (types/dict_compare.go).
        - pattern: ^types\.(Identical|IdenticalIgnoreTags|AssignableTo|ConvertibleTo|Implements|AssertableTo|Satisfies)$
          pkg: ^go/types$
          msg: go/types predicates panic on *DictType; use the DictSafe* functions from types/dict_compare.go
  exclusions:
    paths:
      - types/node.go
    rules:
      - path: types/dict_compare\.go
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - forbidigo

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  govet:
    enable-all: true
  
  gocyclo:
    min-complexity: 15
  
  revive:
    severity: warning
    rules:
      - name: var-naming
        severity: warning
        arguments:
          - ["ID", "URL", "HTTP", "API", "JSON", "XML"]  # Allowed initialisms
      - name: cognitive-complexity
        arguments: [15]
      - name: cyclomatic
        arguments: [10]
      - name: line-length-limit
        arguments: [120]
      - name: function-length
        arguments: [50, 0]
